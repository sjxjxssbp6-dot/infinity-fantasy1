plugins {
    id 'gg.cristalix.bundler' version '5.3.0-beta.2'
    id 'org.jetbrains.kotlin.jvm' version '1.6.21'
}

repositories {
    google()
    mavenLocal()
    mavenCentral()
    maven {
        url 'https://repo.c7x.ru/repository/maven-public/'
        credentials {
            username System.getenv("REPO_C7X_USERNAME")
            password System.getenv("REPO_C7X_PASSWORD")
        }
    }
}

group 'cupcake.nikky.imperium.tower'

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    sourceCompatibility = targetCompatibility = 1.8
}

bundle {
    modName = 'InfinityFantasyMod'
    mainClass = 'cupcake.nikky.imperium.tower.FantasyMod'
    author = 'NeitExx'
    modVersion = '1.2.5-SNAPSHOT'
    asyncModLoad = true
    persistent = true
}

task uploadTest() {
    doLast {
        ssh.run {
            session(remotes.storageServer) {
                put from: tasks.jar.getArchiveFile().get().asFile.path.replace("-raw", "-bundle"),
                        into: "/home/neitexx/storage/test"
            }
        }
    }
}

task uploadProduction() {
    doLast {
        ssh.run {
            session(remotes.storageServer) {
                put from: tasks.jar.getArchiveFile().get().asFile.path.replace("-raw", "-bundle"),
                        into: "/home/neitexx/storage/production"
            }
        }
    }
}

dependencies {
    implementation 'ru.cristalix:enginex:3.8.11'
    implementation(project(":FantasyClientProtocol")) {
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'dev.xdark', module: 'feder'
        exclude group: 'io.netty', module: 'netty-buffer'
        exclude group: 'ru.cristalix', module: 'wada'
        exclude group: 'ru.cristalix', module: 'enginex'
        exclude group: 'net.diamondden', module: 'diamondpaper'
    }
    implementation 'gg.cristalix:particle-system:1.2.5'

    compileOnly 'org.jetbrains:annotations:22.0.0'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

jar {
    archiveBaseName.set bundle.modName
    from {
        configurations.runtimeClasspath.collect { it.directory ? it : zipTree(it) }
    }
    duplicatesStrategy DuplicatesStrategy.EXCLUDE
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withSourcesJar()
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

afterEvaluate { project ->
    jar.from configurations.runtimeClasspath.collect(project.&zipTree)
    tasks.uploadTest.dependsOn(tasks.bundle)
    tasks.uploadProduction.dependsOn(tasks.bundle)
}